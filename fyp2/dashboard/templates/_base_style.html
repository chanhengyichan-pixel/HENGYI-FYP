{# Colours and base styles shared by the login and settings pages. #}
<style>
  :root {
    --bg: #0f1419; --bg-card: #161d27; --bg-header: #111820; --border: #1e2d3d;
    --cyan: #00b4d8; --cyan-dim: #005f73; --green: #22c55e; --red: #ef4444;
    --amber: #f59e0b; --text: #cbd5e1; --text-dim: #64748b; --radius: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, "Segoe UI", sans-serif; font-size: 14px; min-height: 100vh; }
  #header { height: 52px; background: var(--bg-header); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; }
  #header-left { display: flex; align-items: center; gap: 10px; }
  #header-stripe { width: 3px; height: 24px; background: var(--cyan); border-radius: 2px; }
  #header-title { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); }
  .card-hdr { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
              color: var(--text-dim); padding: 12px 16px; border-bottom: 1px solid var(--border); }
  label { display: block; font-size: 0.75rem; color: var(--text-dim); margin: 12px 0 5px; letter-spacing: 0.04em; }
  input, select { width: 100%; background: #0c1117; border: 1px solid var(--border); color: var(--text);
                  border-radius: 6px; padding: 9px 11px; font-size: 0.9rem; }
  input:focus, select:focus { outline: none; border-color: var(--cyan-dim); }
  .btn { background: var(--cyan); color: #00151c; border: none; border-radius: 6px; padding: 9px 16px;
         font-weight: 600; font-size: 0.85rem; cursor: pointer; }
  .btn:hover { filter: brightness(1.1); }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--text-dim); }
  .btn-danger { background: none; border: 1px solid #7f1d1d; color: var(--red); }
  .msg { border-radius: 6px; padding: 9px 12px; font-size: 0.85rem; margin-bottom: 12px; }
  .msg.error { background: #1f0505; border: 1px solid #7f1d1d; color: #fca5a5; }
  .msg.ok { background: #052010; border: 1px solid #166534; color: #86efac; }
  .subtabs { display: flex; gap: 6px; }
  .subtabs a { font-size: 0.82rem; color: var(--text-dim); text-decoration: none; padding: 7px 14px;
               border: 1px solid var(--border); border-radius: 6px; }
  .subtabs a:hover { color: var(--text); }
  .subtabs a.on { color: var(--cyan); border-color: var(--cyan-dim); background: #0b1e27; }
</style>
